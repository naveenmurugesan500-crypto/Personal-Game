<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a081c"/>
      <stop offset="60%" stop-color="#13040e"/>
      <stop offset="100%" stop-color="#080206"/>
    </radialGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a6d"/>
      <stop offset="50%" stop-color="#9b00e8"/>
      <stop offset="100%" stop-color="#05d9e8"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="50%" stop-color="#ff7700"/>
      <stop offset="100%" stop-color="#ffee00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#ff2a6d" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Glowing outer aura -->
  <circle cx="256" cy="256" r="170" fill="#ff0055" opacity="0.15" filter="url(#glow)"/>

  <!-- Stylized Spinning Bottle silhouette -->
  <g transform="translate(256,256) rotate(45) translate(-256,-256)" filter="url(#glow)">
    <!-- Bottle neck -->
    <rect x="236" y="90" width="40" height="90" rx="8" fill="url(#bottleGrad)"/>
    <!-- Bottle cap / rim -->
    <rect x="230" y="80" width="52" height="18" rx="6" fill="#05d9e8"/>
    <!-- Bottle shoulder -->
    <path d="M 236 180 L 195 240 C 195 240 185 255 185 280 L 185 400 C 185 418 200 432 220 432 L 292 432 C 312 432 327 418 327 400 L 327 280 C 327 255 317 240 276 180 Z" fill="url(#bottleGrad)"/>
    <!-- Bottle glass shine lines -->
    <path d="M 210 270 L 210 395 C 210 405 214 410 220 410" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Adult 18+ Badge -->
  <g transform="translate(360, 360)">
    <circle cx="0" cy="0" r="54" fill="#ff0055" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="48" fill="#13040e" stroke="#ff0055" stroke-width="3"/>
    <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">18+</text>
  </g>

  <!-- Flame spark icon on top-left -->
  <g transform="translate(140, 140)">
    <path d="M 0 30 C -15 20 -20 0 0 -25 C 5 -10 10 -5 15 5 C 20 15 15 30 0 30 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  </g>
</svg>
